<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>AuthHTTPDataSourceWidget Example</title>
    <link href="../bootstrap-5.2.3-dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <h3>AuthHTTPDataSourceWidget Example</h3>
    
    <div>
        <h4>Authentication</h4>
        <div>
            JWT Token: <input type="text" id="token-input" placeholder="Enter token"><br>
            Token Type: 
            <select id="token-type">
                <option value="bearer">Bearer</option>
                <option value="basic">Basic</option>
            </select><br>
            <input type="checkbox" id="save-local-storage" checked>
            <label for="save-local-storage">Save to localStorage</label><br>
            <button id="set-token-btn">Set Token</button>
            <button id="clear-token-btn">Clear Token</button>
            <button id="refresh-token-btn">Refresh from Storage</button>
        </div>
    </div>
    
    <div>
        <h4>API Configuration</h4>
        <div>
            Base URL: <input type="text" id="base-url" value="http://localhost:8000"><br>
            API Slug: <input type="text" id="api-slug" value="api/v1"><br>
            Object Name: <input type="text" id="object-name" value="item"><br>
        </div>
    </div>
    
    <div>
        <h4>Operations</h4>
        <button id="read-btn">Read Data</button>
        <button id="create-btn">Create Sample</button>
    </div>
    
    <div>
        <h4>Debug Output</h4>
        <div>
            <h5>Current State</h5>
            <pre id="state-output">No state data</pre>
            
            <h5>Network Results</h5>
            <pre id="result-output">No results yet</pre>
        </div>
    </div>

    <script src="../bootstrap-5.2.3-dist/js/bootstrap.bundle.min.js"></script>
    <script type="module">
        import { DummyWidget } from './widget.js';
        import { AuthHTTPDataSourceWidget } from './authhttpdatasourcewidget.js';

        // Utility function to update state display
        function updateStateDisplay(dataSource) {
            const stateOutput = document.getElementById('state-output');
            
            const state = {
                token: dataSource.token,
                tokenType: dataSource.tokenType,
                tokenInStorage: localStorage.getItem(dataSource.tokenStorageKey),
                autoRefresh: dataSource.autoRefreshToken
            };
            
            stateOutput.textContent = JSON.stringify(state, null, 2);
        }
        
        // Utility function to update result display
        function updateResultDisplay(data, isError = false) {
            const resultOutput = document.getElementById('result-output');
            resultOutput.textContent = JSON.stringify(data, null, 2);
            resultOutput.style.color = isError ? 'red' : 'black';
        }
        
        // ------------------------------------------------
        // MOCK FETCH IMPLEMENTATION
        // ------------------------------------------------
        // Store the original fetch function for reference
        const originalFetch = window.fetch;
        
        // Monkeypatch the global fetch function to return mock responses
        // This allows testing authentication flows without a real backend server
        window.fetch = function(...args) {
            const [url, options] = args;
            console.log("Mock fetch called with:", url, options);
            
            return new Promise((resolve) => {
                setTimeout(() => {
                    // Check for auth token in the request headers
                    const authHeader = options.headers.get('Authorization');
                    
                    if (!authHeader) {
                        // No auth token - return 401 Unauthorized
                        resolve(new Response(
                            JSON.stringify({ detail: "Not authenticated" }),
                            { status: 401, headers: { 'Content-Type': 'application/json' } }
                        ));
                        return;
                    }
                    
                    // Token is present, process the request based on endpoint
                    if (url.endsWith('/read')) {
                        // Mock response for READ operation
                        resolve(new Response(
                            JSON.stringify({
                                items: [
                                    { uuid: "1", title: "Item 1", description: "Description 1" },
                                    { uuid: "2", title: "Item 2", description: "Description 2" }
                                ]
                            }),
                            { status: 200, headers: { 'Content-Type': 'application/json' } }
                        ));
                    } else if (url.endsWith('/create')) {
                        // Mock response for CREATE operation
                        const item = JSON.parse(options.body);
                        resolve(new Response(
                            JSON.stringify({ success: true, item: { ...item, uuid: "3" } }),
                            { status: 200, headers: { 'Content-Type': 'application/json' } }
                        ));
                    } else {
                        // Unknown endpoint
                        resolve(new Response(
                            JSON.stringify({ detail: "Unknown endpoint" }),
                            { status: 404, headers: { 'Content-Type': 'application/json' } }
                        ));
                    }
                }, 300); // 300ms delay
            });
        };
        // ------------------------------------------------
        
        // Create a data model subclass for testing
        class TestAuthDataSourceWidget extends AuthHTTPDataSourceWidget {
            declareDatamodels() {
                // Define the data model for our test operations
                this.datamodel_create = {
                    title: { 
                        label: "Title", 
                        help: "Item title", 
                        check: (val) => { return { value: val, error: null }; } 
                    },
                    description: { 
                        label: "Description", 
                        help: "Item description", 
                        check: (val) => { return { value: val, error: null }; } 
                    }
                };
                this.datamodel_read = this.datamodel_create;
                this.datamodel_update = this.datamodel_create;
            }
        }
        
        // Initialize the datasource
        const dataSource = new TestAuthDataSourceWidget({
            base_address: document.getElementById('base-url').value,
            api_slug: document.getElementById('api-slug').value,
            object_name: document.getElementById('object-name').value,
            authOptions: {
                autoRefreshToken: true  // Auto-refresh token from localStorage on init
            }
        });
        
        // Enable debug logging
        dataSource.setLogLevel(-1);
        
        // Connect signals to UI updates
        dataSource.signals.data.connect((data) => {
            updateResultDisplay({ operation: "Data received", data });
        });
        
        dataSource.signals.error.connect((error) => {
            updateResultDisplay({ operation: "Error", error }, true);
        });
        
        dataSource.signals.token_expired.connect(() => {
            updateResultDisplay({ operation: "Token Expired", message: "Your session has expired" }, true);
        });
        
        // UI Event Handlers
        document.getElementById('set-token-btn').addEventListener('click', () => {
            const token = document.getElementById('token-input').value;
            const tokenType = document.getElementById('token-type').value;
            const storeInLocalStorage = document.getElementById('save-local-storage').checked;
            
            if (!token) {
                alert("Please enter a token");
                return;
            }
            
            // Set the token in the data source
            dataSource.set_token_slot({
                token,
                tokenType,
                storeInLocalStorage
            });
            
            updateStateDisplay(dataSource);
        });
        
        document.getElementById('clear-token-btn').addEventListener('click', () => {
            // Clear the token from the data source and localStorage
            dataSource.clear_token_slot();
            updateStateDisplay(dataSource);
        });
        
        document.getElementById('refresh-token-btn').addEventListener('click', () => {
            // Load token from localStorage if available
            dataSource.refresh_token_from_storage_slot();
            updateStateDisplay(dataSource);
        });
        
        document.getElementById('read-btn').addEventListener('click', () => {
            // Update config from UI before reading
            dataSource.ctx.base_address = document.getElementById('base-url').value;
            dataSource.ctx.api_slug = document.getElementById('api-slug').value;
            dataSource.ctx.object_name = document.getElementById('object-name').value;
            dataSource.createState();
            
            // Call read
            dataSource.read_slot();
        });
        
        document.getElementById('create-btn').addEventListener('click', () => {
            // Update config from UI before creating
            dataSource.ctx.base_address = document.getElementById('base-url').value;
            dataSource.ctx.api_slug = document.getElementById('api-slug').value;
            dataSource.ctx.object_name = document.getElementById('object-name').value;
            dataSource.createState();
            
            // Sample data to create
            const newItem = {
                title: "New Test Item",
                description: "This is a test item created from the demo page"
            };
            
            // Call create
            dataSource.create_slot(newItem);
        });
        
        // Initialize the state display
        updateStateDisplay(dataSource);
        
        // Auto-fill token from localStorage if available
        const savedToken = localStorage.getItem('token');
        if (savedToken) {
            document.getElementById('token-input').value = savedToken;
        }
    </script>
</body>
</html>
