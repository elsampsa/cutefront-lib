<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>HTTPDataSourceWidget Example</title>
    <link href="../bootstrap-5.2.3-dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <h3>HTTPDataSourceWidget Example</h3>
    
    <div>
        <h4>API Configuration</h4>
        <div>
            Base URL: <input type="text" id="base-url" value="http://localhost:8000"><br>
            API Slug: <input type="text" id="api-slug" value="api/v1"><br>
            Object Name: <input type="text" id="object-name" value="item"><br>
            <button id="update-config-btn">Update Configuration</button>
        </div>
    </div>
    
    <div>
        <h4>CRUD Operations</h4>
        <button id="read-btn">Read Data</button><br><br>
        
        <div>
            <h5>Create Item</h5>
            Title: <input type="text" id="create-title" value="New Test Item"><br>
            Description: <textarea id="create-description">This is a test item</textarea><br>
            <button id="create-btn">Create Item</button>
        </div><br>
        
        <div>
            <h5>Update Item</h5>
            UUID: <input type="text" id="update-uuid" value="1"><br>
            Title: <input type="text" id="update-title" value="Updated Item"><br>
            Description: <textarea id="update-description">This item has been updated</textarea><br>
            <button id="update-btn">Update Item</button>
        </div><br>
        
        <div>
            <h5>Delete Item</h5>
            UUID: <input type="text" id="delete-uuid" value="1"><br>
            <button id="delete-btn">Delete Item</button>
        </div>
    </div>
    
    <div>
        <h4>Debug Output</h4>
        <div>
            <h5>API Configuration</h5>
            <pre id="config-output">Loading...</pre>
            
            <h5>Data Model</h5>
            <pre id="model-output">No model data</pre>
            
            <h5>Results</h5>
            <pre id="result-output">No results yet</pre>
        </div>
    </div>

    <script src="../bootstrap-5.2.3-dist/js/bootstrap.bundle.min.js"></script>
    <script type="module">
        import { DummyWidget } from './widget.js';
        import { HTTPDataSourceWidget } from './httpdatasourcewidget.js';
        
        // Utility functions for updating the display
        function updateConfigDisplay(dataSource) {
            const configOutput = document.getElementById('config-output');
            const config = {
                base_address: dataSource.ctx.base_address,
                api_slug: dataSource.ctx.api_slug,
                object_name: dataSource.ctx.object_name,
                adr: dataSource.adr
            };
            configOutput.textContent = JSON.stringify(config, null, 2);
        }
        
        function updateModelDisplay(dataSource) {
            const modelOutput = document.getElementById('model-output');
            modelOutput.textContent = JSON.stringify(dataSource.datamodel_create, null, 2);
        }
        
        function updateResultDisplay(data, isError = false) {
            const resultOutput = document.getElementById('result-output');
            resultOutput.textContent = JSON.stringify(data, null, 2);
            resultOutput.style.color = isError ? 'red' : 'black';
        }
        
        // ------------------------------------------------
        // MOCK FETCH IMPLEMENTATION
        // ------------------------------------------------
        // Store the original fetch function so we can restore it if needed
        const originalFetch = window.fetch;
        
        // Monkeypatch the global fetch function to return mock responses
        // This allows testing without a real backend server
        window.fetch = function(...args) {
            const [url, options] = args;
            console.log("Mock fetch called with:", url, options);
            
            return new Promise((resolve) => {
                // Add delay to simulate network latency
                setTimeout(() => {
                    // Return different mock responses based on the endpoint
                    if (url.endsWith('/read')) {
                        // Mock response for READ operation
                        resolve(new Response(
                            JSON.stringify({
                                items: [
                                    { uuid: "1", title: "Item 1", description: "Description 1" },
                                    { uuid: "2", title: "Item 2", description: "Description 2" }
                                ]
                            }),
                            { status: 200, headers: { 'Content-Type': 'application/json' } }
                        ));
                    } else if (url.endsWith('/create')) {
                        // Mock response for CREATE operation
                        const item = JSON.parse(options.body);
                        resolve(new Response(
                            JSON.stringify({ success: true, item: { ...item, uuid: "3" } }),
                            { status: 200, headers: { 'Content-Type': 'application/json' } }
                        ));
                    } else if (url.endsWith('/update')) {
                        // Mock response for UPDATE operation
                        const item = JSON.parse(options.body);
                        resolve(new Response(
                            JSON.stringify({ success: true, item }),
                            { status: 200, headers: { 'Content-Type': 'application/json' } }
                        ));
                    } else if (url.endsWith('/delete')) {
                        // Mock response for DELETE operation
                        resolve(new Response(
                            JSON.stringify({ success: true, deleted: document.getElementById('delete-uuid').value }),
                            { status: 200, headers: { 'Content-Type': 'application/json' } }
                        ));
                    } else {
                        // Unknown endpoint - return 404
                        resolve(new Response(
                            JSON.stringify({ detail: "Unknown endpoint" }),
                            { status: 404, headers: { 'Content-Type': 'application/json' } }
                        ));
                    }
                }, 300); // 300ms delay
            });
        };
        // ------------------------------------------------
        
        // Subclass HTTPDataSourceWidget to implement our test data model
        class TestDataSourceWidget extends HTTPDataSourceWidget {
            declareDatamodels() {
                // Define the data models for different operations
                this.datamodel_create = {
                    title: { 
                        label: "Title", 
                        help: "Item title", 
                        check: this.checkStr.bind(this)
                    },
                    description: { 
                        label: "Description", 
                        help: "Item description", 
                        check: this.checkStr.bind(this)
                    }
                };
                this.datamodel_read = this.datamodel_create;
                this.datamodel_update = this.datamodel_create;
            }
            
            // Simple validation function for strings
            checkStr(val) {
                if (!val || val.trim() === '') {
                    return { value: null, error: "Cannot be empty" };
                }
                return { value: val, error: null };
            }
        }
        
        // Initialize the data source with values from the form
        const dataSource = new TestDataSourceWidget({
            base_address: document.getElementById('base-url').value,
            api_slug: document.getElementById('api-slug').value,
            object_name: document.getElementById('object-name').value
        });
        
        // Enable debug logging to see detailed messages in console
        dataSource.setLogLevel(-1);
        
        // Connect signals to UI updates and handlers
        const dummy = new DummyWidget();
        
        // When data is received, update the UI
        dataSource.signals.data.connect((data) => {
            updateResultDisplay({ operation: "Data received", count: data.length, data });
        });
        
        // When an error occurs, show it in the UI
        dataSource.signals.error.connect((error) => {
            updateResultDisplay({ operation: "Error", message: error }, true);
        });
        
        // Connect model signals to dummy handlers
        dataSource.signals.datamodel_create.connect(dummy.slot.bind(dummy));
        dataSource.signals.datamodel_read.connect(dummy.slot.bind(dummy));
        dataSource.signals.datamodel_update.connect(dummy.slot.bind(dummy));
        
        // UI Event Handlers for buttons
        document.getElementById('update-config-btn').addEventListener('click', () => {
            const newConfig = {
                base_address: document.getElementById('base-url').value,
                api_slug: document.getElementById('api-slug').value,
                object_name: document.getElementById('object-name').value
            };
            
            // Update the data source configuration
            Object.assign(dataSource.ctx, newConfig);
            dataSource.createState();
            
            updateConfigDisplay(dataSource);
            updateModelDisplay(dataSource);
        });
        
        // Read button handler
        document.getElementById('read-btn').addEventListener('click', () => {
            dataSource.read_slot();
        });
        
        // Create button handler
        document.getElementById('create-btn').addEventListener('click', () => {
            const newItem = {
                title: document.getElementById('create-title').value,
                description: document.getElementById('create-description').value
            };
            
            dataSource.create_slot(newItem);
        });
        
        // Update button handler
        document.getElementById('update-btn').addEventListener('click', () => {
            const updatedItem = {
                uuid: document.getElementById('update-uuid').value,
                title: document.getElementById('update-title').value,
                description: document.getElementById('update-description').value
            };
            
            dataSource.update_slot(updatedItem);
        });
        
        // Delete button handler
        document.getElementById('delete-btn').addEventListener('click', () => {
            const uuid = document.getElementById('delete-uuid').value;
            dataSource.delete_slot(uuid);
        });
        
        // Initialize the UI displays
        updateConfigDisplay(dataSource);
        updateModelDisplay(dataSource);
        
        // Signal data models on startup
        dataSource.model_slot();
    </script>
</body>
</html>
